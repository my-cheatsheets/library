name: Publish

# Publishes the library to GitHub Pages, at https://library.my-cheatsheets.com/v1/,
# on every change to main. Nothing is published unless every sheet passes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A newer one waits, rather than cancelling one already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Get the website's validator
        run: curl --fail --silent --show-error --location --output validate.mjs https://my-cheatsheets.com/validate.mjs
      - run: node --test "scripts/*.test.mjs"
      - run: node scripts/publish.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
